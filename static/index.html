<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess 1010</title>
    <style>
      /* ── reset & tokens ─────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0d1117;
        --surf: #161b22;
        --surf2: #21262d;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #238636;
        --green-h: #2ea043;
        --red: #f85149;
        --sq-light: #f0d9b5;
        --sq-dark: #b58863;
        --sq-sel: rgba(20, 100, 20, 0.55);
        --sq-last: rgba(155, 199, 0, 0.42);
        --sq-dot: rgba(0, 0, 0, 0.22);
        --sz: 56px; /* square size — shrinks on mobile */
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── header ─────────────────────────────────────── */
      header {
        background: var(--surf);
        border-bottom: 1px solid var(--border);
        padding: 0 20px;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      header .logo {
        font-size: 1.4rem;
      }
      header h1 {
        font-size: 1.05rem;
        font-weight: 700;
      }
      header .tag {
        font-size: 0.68rem;
        background: var(--surf2);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 2px 7px;
        border-radius: 99px;
      }
      header .spacer {
        flex: 1;
      }
      header .api-note {
        font-size: 0.72rem;
        color: var(--muted);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
      }

      /* ── shared card ─────────────────────────────────── */
      .card {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 18px 0;
      }

      /* ── buttons ─────────────────────────────────────── */
      .btn {
        display: block;
        width: 100%;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }
      .btn-primary {
        background: var(--green);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--green-h);
      }
      .btn-secondary {
        background: var(--surf2);
        color: var(--text);
        border-color: var(--border);
      }
      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-danger {
        background: transparent;
        color: var(--red);
        border-color: var(--red);
      }
      .btn-danger:hover {
        background: rgba(248, 81, 73, 0.1);
      }
      .btn-sm {
        width: auto;
        padding: 7px 13px;
        font-size: 0.8rem;
      }
      .btn-icon {
        width: auto;
        padding: 6px 10px;
        font-size: 0.85rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surf2);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn-icon:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* segment (multi-choice) */
      .seg {
        display: flex;
        gap: 5px;
      }
      .seg-btn {
        flex: 1;
        padding: 7px 4px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surf2);
        color: var(--text);
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.15s;
        text-align: center;
      }
      .seg-btn.on {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(88, 166, 255, 0.1);
        font-weight: 600;
      }
      .seg-btn:hover:not(.on) {
        border-color: var(--muted);
      }

      /* inputs */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 0.75rem;
        color: var(--muted);
      }
      input[type="text"] {
        padding: 9px 13px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surf2);
        color: var(--text);
        font-size: 0.88rem;
        outline: none;
        width: 100%;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
      }
      input[type="text"]::placeholder {
        color: var(--muted);
      }

      /* ── lobby ───────────────────────────────────────── */
      #lobby {
        width: 100%;
        max-width: 420px;
      }
      .lobby-hero {
        text-align: center;
        margin-bottom: 24px;
      }
      .lobby-hero .icon {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 8px;
      }
      .lobby-hero h2 {
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 5px;
      }
      .lobby-hero p {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .join-row {
        display: flex;
        gap: 7px;
      }
      .join-row input {
        flex: 1;
      }

      /* ── game ────────────────────────────────────────── */
      #game {
        display: none;
        gap: 18px;
        align-items: flex-start;
        max-width: 900px;
        width: 100%;
      }
      #game.on {
        display: flex;
      }

      /* player bar */
      .pbar {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .pbar.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .pbar-icon {
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .pbar-info {
        flex: 1;
        min-width: 0;
      }
      .pbar-name {
        font-weight: 600;
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pbar-sub {
        font-size: 0.72rem;
        color: var(--muted);
      }
      .pbar-clock {
        font-size: 1.1rem;
        font-weight: 700;
        font-family: monospace;
        flex-shrink: 0;
        letter-spacing: 0.05em;
      }
      .pbar-clock.low {
        color: var(--red);
      }
      .pbar-clock.active-clock {
        color: var(--accent);
      }

      /* board area */
      .board-col {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
      }
      .board-mid {
        display: flex;
        gap: 5px;
      }
      .rank-col {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        width: 16px;
      }
      .file-row {
        display: flex;
        padding-left: 21px;
      }
      .coord {
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        user-select: none;
      }
      .file-row .coord {
        width: var(--sz);
      }

      /* board grid */
      .board {
        display: grid;
        grid-template-columns: repeat(10, var(--sz));
        grid-template-rows: repeat(10, var(--sz));
        border: 2px solid #111;
        border-radius: 3px;
        overflow: hidden;
        user-select: none;
      }
      .sq {
        width: var(--sz);
        height: var(--sz);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .sq.light {
        background: var(--sq-light);
      }
      .sq.dark {
        background: var(--sq-dark);
      }
      .sq.sel::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--sq-sel);
        z-index: 1;
        pointer-events: none;
      }
      .sq.last-move {
        background: var(--sq-last) !important;
      }
      .sq.in-check::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(255, 20, 20, 0.85) 0%,
          rgba(255, 0, 0, 0.3) 60%,
          transparent 100%
        );
      }
      .sq.dot::before {
        content: "";
        position: absolute;
        width: 34%;
        height: 34%;
        border-radius: 50%;
        background: var(--sq-dot);
        z-index: 2;
        pointer-events: none;
      }
      .sq.ring::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 5px solid var(--sq-dot);
        z-index: 2;
        pointer-events: none;
      }
      .sq img.piece {
        width: 88%;
        height: 88%;
        object-fit: contain;
        position: relative;
        z-index: 3;
        pointer-events: none;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
      }
      .sq .pfb {
        font-size: 34px;
        line-height: 1;
        position: relative;
        z-index: 3;
        pointer-events: none;
      }

      /* sidebar */
      .sidebar {
        flex: 1;
        min-width: 200px;
        max-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .status-card {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 15px;
        text-align: center;
      }
      .status-txt {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .status-txt.my-turn {
        color: var(--accent);
        font-weight: 600;
      }
      .status-txt.danger {
        color: var(--red);
        font-weight: 600;
      }

      .share-card {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 15px;
      }
      .share-label {
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .share-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .gid-box {
        flex: 1;
        font-family: monospace;
        font-size: 0.85rem;
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 9px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .moves-card {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 15px;
        flex: 1;
        min-height: 0;
      }
      .moves-title {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .moves-grid {
        display: grid;
        grid-template-columns: 20px 1fr 1fr;
        gap: 1px 5px;
        font-size: 0.78rem;
        font-family: monospace;
        max-height: 240px;
        overflow-y: auto;
      }
      .mn {
        color: var(--muted);
      }
      .mw,
      .mb {
        padding: 2px 3px;
        border-radius: 3px;
      }
      .mw:hover,
      .mb:hover {
        background: var(--surf2);
      }

      .result-card {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        text-align: center;
        display: none;
      }
      .result-card.on {
        display: block;
      }
      .result-card h3 {
        font-size: 1rem;
        margin-bottom: 5px;
      }
      .result-card p {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .ctrl {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      /* ── promo modal ─────────────────────────────────── */
      #promo-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        z-index: 50;
        align-items: center;
        justify-content: center;
      }
      #promo-modal.on {
        display: flex;
      }
      .promo-dlg {
        background: var(--surf);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
        text-align: center;
      }
      .promo-dlg h3 {
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .promo-row {
        display: flex;
        gap: 10px;
      }
      .promo-btn {
        width: 68px;
        height: 68px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surf2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .promo-btn:hover {
        border-color: var(--accent);
        transform: scale(1.07);
      }
      .promo-btn img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      /* ── toast ───────────────────────────────────────── */
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--surf);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 0.82rem;
        z-index: 99;
        white-space: nowrap;
        transition: transform 0.25s ease;
        pointer-events: none;
      }
      #toast.on {
        transform: translateX(-50%) translateY(0);
      }
      #toast.err {
        border-color: var(--red);
        color: var(--red);
      }

      /* spinner */
      .spin {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
        margin-right: 4px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── responsive ──────────────────────────────────── */
      @media (max-width: 680px) {
        :root {
          --sz: 36px;
        }
        #game.on {
          flex-direction: column;
          align-items: center;
        }
        .sidebar {
          max-width: 100%;
          width: 100%;
        }
        .moves-grid {
          max-height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">♟</span>
      <h1>Chess 1010</h1>
      <span class="tag">10 × 10</span>
      <span class="spacer"></span>
      <span class="api-note" id="api-note"></span>
    </header>

    <main>
      <!-- ═══════════════ LOBBY ═══════════════ -->
      <div id="lobby">
        <div class="lobby-hero">
          <div class="icon">♟</div>
          <h2>Chess 1010</h2>
          <p>10 × 10 — play with a friend online</p>
        </div>

        <div class="card">
          <div class="card-title">Create Game</div>

          <div class="field">
            <label>Your name</label>
            <input
              type="text"
              id="create-name"
              placeholder="e.g. Alice"
              maxlength="24"
            />
          </div>

          <div class="field">
            <label>Play as</label>
            <div class="seg" id="side-seg">
              <button class="seg-btn on" data-val="w" onclick="setSide('w')">
                ⬜ White
              </button>
              <button class="seg-btn" data-val="b" onclick="setSide('b')">
                ⬛ Black
              </button>
              <button
                class="seg-btn"
                data-val="random"
                onclick="setSide('random')"
              >
                🎲 Random
              </button>
            </div>
          </div>

          <div class="field">
            <label>Time control</label>
            <div class="seg" id="tc-seg">
              <button class="seg-btn on" data-val="0" onclick="setTC(0)">
                ∞ Unlimited
              </button>
              <button class="seg-btn" data-val="180" onclick="setTC(180)">
                3 min
              </button>
              <button class="seg-btn" data-val="300" onclick="setTC(300)">
                5 min
              </button>
              <button class="seg-btn" data-val="600" onclick="setTC(600)">
                10 min
              </button>
            </div>
          </div>

          <button class="btn btn-primary" onclick="doCreate()">
            Create Game
          </button>
        </div>

        <div class="card">
          <div class="card-title">Join Game</div>
          <div class="field">
            <label>Your name</label>
            <input
              type="text"
              id="join-name"
              placeholder="e.g. Bob"
              maxlength="24"
            />
          </div>
          <div class="join-row">
            <input
              type="text"
              id="join-id"
              placeholder="Game ID or full link"
              maxlength="80"
            />
            <button class="btn btn-secondary btn-sm" onclick="doJoin()">
              Join
            </button>
          </div>
        </div>
      </div>

      <!-- ═══════════════ GAME ════════════════ -->
      <div id="game">
        <!-- Board column -->
        <div class="board-col">
          <!-- Opponent (top) -->
          <div class="pbar" id="top-bar">
            <span class="pbar-icon" id="top-icon">♟</span>
            <div class="pbar-info">
              <div class="pbar-name" id="top-name">Opponent</div>
              <div class="pbar-sub" id="top-sub">Black</div>
            </div>
            <span class="pbar-clock" id="top-clock"></span>
          </div>

          <!-- Board + rank labels -->
          <div class="board-mid">
            <div class="rank-col" id="rank-col"></div>
            <div>
              <div class="board" id="board"></div>
              <div class="file-row" id="file-row"></div>
            </div>
          </div>

          <!-- Me (bottom) -->
          <div class="pbar" id="bot-bar">
            <span class="pbar-icon" id="bot-icon">♙</span>
            <div class="pbar-info">
              <div class="pbar-name" id="bot-name">You</div>
              <div class="pbar-sub" id="bot-sub">White</div>
            </div>
            <span class="pbar-clock" id="bot-clock"></span>
          </div>
        </div>
        <!-- board-col -->

        <!-- Sidebar -->
        <div class="sidebar">
          <div class="status-card">
            <div class="status-txt" id="status-txt">Setting up…</div>
          </div>

          <div class="result-card" id="result-card">
            <h3 id="result-title">Game Over</h3>
            <p id="result-sub"></p>
            <button class="btn btn-primary" onclick="goLobby()">
              Play Again
            </button>
          </div>

          <div class="share-card" id="share-card" style="display: none">
            <div class="share-label">Share with opponent</div>
            <div class="share-row">
              <div class="gid-box" id="gid-box">—</div>
              <button class="btn-icon" onclick="copyLink()" title="Copy link">
                📋
              </button>
            </div>
          </div>

          <div class="moves-card">
            <div class="moves-title">Moves</div>
            <div class="moves-grid" id="moves-grid"></div>
          </div>

          <div class="ctrl">
            <button class="btn btn-danger" id="resign-btn" onclick="doResign()">
              Resign
            </button>
            <button class="btn btn-secondary" onclick="goLobby()">
              ← New Game
            </button>
          </div>
        </div>
        <!-- sidebar -->
      </div>
      <!-- game -->
    </main>

    <!-- Promotion modal -->
    <div id="promo-modal">
      <div class="promo-dlg">
        <h3>Promote pawn to…</h3>
        <div class="promo-row" id="promo-row"></div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      // ═══════════════════════════════════════════════════════
      // CONFIG — change this to point at your Go server
      // ═══════════════════════════════════════════════════════
      const API = (() => {
        return "http://localhost:8080";
        // If the page is served from the same host as the API, use relative paths.
        // Otherwise set an explicit origin, e.g.: const API = 'http://192.168.1.5:8080'
        if (location.protocol === "file:") return "http://localhost:8080";
        return ""; // same-origin: relative URLs work fine
      })();

      // ═══════════════════════════════════════════════════════
      // State
      // ═══════════════════════════════════════════════════════
      const G = {
        gameId: null,
        token: null,
        color: null,

        // server state
        board: null,
        turn: null,
        status: null,
        winner: null,
        waiting: false,
        history: [],
        playerNames: {},
        timeControl: 0,
        whiteMs: 0,
        blackMs: 0,
        turnStartedAt: 0,

        // board interaction
        selected: null,
        legalSq: [],
        lastFrom: null,
        lastTo: null,
        pendingPromo: null,

        // lobby choices
        sideChoice: "w",
        tcChoice: 0,

        es: null, // EventSource
        clockTick: null, // setInterval handle
      };

      const FILES = "abcdefghij";
      const FB = {
        // fallback unicode pieces
        wK: "♔",
        wQ: "♕",
        wR: "♖",
        wB: "♗",
        wN: "♘",
        wP: "♙",
        bK: "♚",
        bQ: "♛",
        bR: "♜",
        bB: "♝",
        bN: "♞",
        bP: "♟",
      };

      // ═══════════════════════════════════════════════════════
      // Boot
      // ═══════════════════════════════════════════════════════
      window.addEventListener("load", () => {
        // Show API base in header if cross-origin
        if (API) $("api-note").textContent = API;

        const p = new URLSearchParams(location.search);
        const gid = p.get("g");
        if (gid) autoJoin(gid);
      });

      // ═══════════════════════════════════════════════════════
      // Lobby helpers
      // ═══════════════════════════════════════════════════════
      function setSide(v) {
        G.sideChoice = v;
        $$("#side-seg .seg-btn").forEach((b) =>
          b.classList.toggle("on", b.dataset.val === v),
        );
      }
      function setTC(v) {
        G.tcChoice = v;
        $$("#tc-seg .seg-btn").forEach((b) =>
          b.classList.toggle("on", +b.dataset.val === v),
        );
      }

      async function doCreate() {
        const name = $("create-name").value.trim() || "Player";
        try {
          const d = await api("POST", "/api/game/create", {
            player_name: name,
            player_color: G.sideChoice,
            time_control: G.tcChoice,
          });
          saveSession(d.game_id, d.token, d.color);
          enterGame(d.game_id, d.token, d.color);
        } catch (e) {
          toast("Could not create game: " + e.message, true);
        }
      }

      async function doJoin() {
        const name = $("join-name").value.trim() || "Player";
        let raw = $("join-id").value.trim();
        // Accept full URL
        try {
          raw = new URL(raw).searchParams.get("g") || raw;
        } catch {}
        if (!raw) {
          toast("Enter a Game ID", true);
          return;
        }
        tryJoin(raw, name);
      }

      async function autoJoin(gid) {
        const saved = loadSession(gid);
        if (saved) {
          // Re-connect with existing credentials
          enterGame(gid, saved.token, saved.color);
          return;
        }
        // Need to show join form pre-filled with game ID
        $("join-id").value = gid;
        toast("Enter your name and click Join");
      }

      async function tryJoin(gid, name) {
        try {
          const d = await api("POST", `/api/game/${gid}/join`, {
            player_name: name,
          });
          saveSession(gid, d.token, d.color);
          enterGame(gid, d.token, d.color);
        } catch (e) {
          toast(e.message || "Could not join game", true);
        }
      }

      // ═══════════════════════════════════════════════════════
      // Session persistence (survives F5)
      // ═══════════════════════════════════════════════════════
      function saveSession(gid, token, color) {
        try {
          localStorage.setItem(
            `c1010:${gid}`,
            JSON.stringify({ token, color }),
          );
        } catch {}
      }
      function loadSession(gid) {
        try {
          return JSON.parse(localStorage.getItem(`c1010:${gid}`));
        } catch {
          return null;
        }
      }

      // ═══════════════════════════════════════════════════════
      // Enter game view
      // ═══════════════════════════════════════════════════════
      function enterGame(gid, token, color) {
        G.gameId = gid;
        G.token = token;
        G.color = color;
        G.selected = null;
        G.legalSq = [];

        history.pushState({}, "", `?g=${gid}`);

        $("lobby").style.display = "none";
        $("game").classList.add("on");

        const isW = color === "w";
        $("bot-icon").textContent = isW ? "♙" : "♟";
        $("bot-sub").textContent = isW ? "White" : "Black";
        $("top-icon").textContent = isW ? "♟" : "♙";
        $("top-sub").textContent = isW ? "Black" : "White";

        $("share-card").style.display = "";
        $("gid-box").textContent = gid;

        buildBoard();
        buildCoords();
        connectSSE();
      }

      function goLobby() {
        if (G.es) {
          G.es.close();
          G.es = null;
        }
        clearInterval(G.clockTick);
        G.clockTick = null;
        Object.assign(G, {
          gameId: null,
          token: null,
          color: null,
          board: null,
          turn: null,
          status: null,
          winner: null,
          waiting: false,
          history: [],
          playerNames: {},
          timeControl: 0,
          whiteMs: 0,
          blackMs: 0,
          turnStartedAt: 0,
          selected: null,
          legalSq: [],
          lastFrom: null,
          lastTo: null,
        });
        history.replaceState({}, "", "/");
        $("game").classList.remove("on");
        $("lobby").style.display = "";
      }

      // ═══════════════════════════════════════════════════════
      // Board construction
      // ═══════════════════════════════════════════════════════
      function rowOrder() {
        const a = [];
        if (G.color === "w") for (let r = 9; r >= 0; r--) a.push(r);
        else for (let r = 0; r <= 9; r++) a.push(r);
        return a;
      }

      function buildBoard() {
        const el = $("board");
        el.innerHTML = "";
        for (const r of rowOrder()) {
          for (let c = 0; c < 10; c++) {
            const sq = document.createElement("div");
            sq.className = "sq " + ((r + c) % 2 === 0 ? "dark" : "light");
            sq.dataset.r = r;
            sq.dataset.c = c;
            sq.addEventListener("click", () => handleClick(r, c));
            el.appendChild(sq);
          }
        }
      }

      function buildCoords() {
        const rc = $("rank-col");
        rc.innerHTML = "";
        for (const r of rowOrder()) {
          const s = document.createElement("span");
          s.className = "coord";
          s.textContent = r + 1;
          rc.appendChild(s);
        }
        const fr = $("file-row");
        fr.innerHTML = "";
        for (let c = 0; c < 10; c++) {
          const s = document.createElement("span");
          s.className = "coord";
          s.textContent = FILES[c];
          fr.appendChild(s);
        }
      }

      // ═══════════════════════════════════════════════════════
      // Board rendering
      // ═══════════════════════════════════════════════════════
      function renderBoard() {
        if (!G.board) return;

        let checkSq = null;
        if (G.status === "check" || G.status === "checkmate") {
          outer: for (let r = 0; r < 10; r++)
            for (let c = 0; c < 10; c++) {
              const p = G.board[r][c];
              if (p && p.kind === "K" && p.color === G.turn) {
                checkSq = [r, c];
                break outer;
              }
            }
        }

        const lset = new Set(G.legalSq.map(([r, c]) => `${r},${c}`));

        $$(".sq").forEach((sq) => {
          const r = +sq.dataset.r,
            c = +sq.dataset.c;
          sq.className = "sq " + ((r + c) % 2 === 0 ? "dark" : "light");

          if (G.lastFrom && G.lastTo) {
            const [fr, fc] = G.lastFrom,
              [tr, tc] = G.lastTo;
            if ((r === fr && c === fc) || (r === tr && c === tc))
              sq.classList.add("last-move");
          }
          if (G.selected && G.selected[0] === r && G.selected[1] === c)
            sq.classList.add("sel");
          if (lset.has(`${r},${c}`)) {
            sq.classList.add(G.board[r][c] ? "ring" : "dot");
          }
          if (checkSq && checkSq[0] === r && checkSq[1] === c)
            sq.classList.add("in-check");

          sq.innerHTML = "";
          const p = G.board[r][c];
          if (p) {
            const img = document.createElement("img");
            img.className = "piece";
            // Try to load PNG from the assets folder (relative to API server)
            img.src = `/assets/pieces/${p.color}${p.kind}.png`;
            img.alt = FB[p.color + p.kind] || "?";
            img.onerror = function () {
              this.remove();
              const t = document.createElement("span");
              t.className = "pfb";
              t.textContent = FB[p.color + p.kind] || "?";
              sq.appendChild(t);
            };
            sq.appendChild(img);
          }
        });

        updateSidebar();
      }

      // ═══════════════════════════════════════════════════════
      // Sidebar
      // ═══════════════════════════════════════════════════════
      function updateSidebar() {
        const myTurn = G.turn === G.color;
        const isOver =
          ["checkmate", "stalemate", "resigned"].includes(G.status) ||
          !!G.winner;
        const topBar = $("top-bar");
        const botBar = $("bot-bar");

        topBar.classList.toggle("active", !isOver && !myTurn && !G.waiting);
        botBar.classList.toggle("active", !isOver && myTurn && !G.waiting);

        // Player names
        const oppColor = G.color === "w" ? "b" : "w";
        const myName = G.playerNames[G.color] || "You";
        const oppName = G.playerNames[oppColor] || "Opponent";
        $("bot-name").textContent = myName;
        $("top-name").textContent = oppName;

        // Status text
        const stEl = $("status-txt");
        stEl.className = "status-txt";
        if (G.waiting) {
          stEl.innerHTML = '<span class="spin"></span>Waiting for opponent…';
        } else if (G.status === "checkmate") {
          const iWon = G.winner === G.color;
          stEl.textContent = iWon
            ? "🏆 Checkmate — You win!"
            : "😔 Checkmate — You lose";
          stEl.className = "status-txt " + (iWon ? "my-turn" : "danger");
        } else if (G.status === "stalemate") {
          stEl.textContent = "🤝 Stalemate — Draw";
        } else if (G.status === "resigned") {
          const iWon = G.winner === G.color;
          stEl.textContent = iWon ? "🏆 Opponent resigned!" : "😔 You resigned";
          stEl.className = "status-txt " + (iWon ? "my-turn" : "danger");
        } else if (G.status === "check") {
          stEl.textContent = myTurn
            ? "⚠️ You are in check!"
            : "⚠️ Opponent is in check";
          stEl.className = "status-txt danger";
        } else {
          stEl.textContent = myTurn ? "● Your turn" : "○ Opponent's turn";
          if (myTurn) stEl.className = "status-txt my-turn";
        }

        // Result card
        const result = $("result-card");
        if (isOver) {
          result.classList.add("on");
          if (G.status === "stalemate") {
            $("result-title").textContent = "🤝 Draw";
            $("result-sub").textContent = "The game ended in stalemate.";
          } else {
            const iWon = G.winner === G.color;
            $("result-title").textContent = iWon
              ? "🏆 You Win!"
              : "😔 You Lose";
            const reason =
              G.status === "checkmate"
                ? "by checkmate"
                : G.status === "resigned"
                  ? "by resignation"
                  : "";
            $("result-sub").textContent =
              `${G.winner === "w" ? "White" : "Black"} wins ${reason}.`;
          }
          $("resign-btn").style.display = "none";
        } else {
          result.classList.remove("on");
          $("resign-btn").style.display = "";
        }

        // Move history
        const grid = $("moves-grid");
        grid.innerHTML = "";
        for (let i = 0; i < G.history.length; i += 2) {
          const n = span("mn", i / 2 + 1 + ".");
          const w = span("mw", fmtMove(G.history[i]));
          const b = span(
            "mb",
            G.history[i + 1] ? fmtMove(G.history[i + 1]) : "…",
          );
          grid.append(n, w, b);
        }
        grid.scrollTop = grid.scrollHeight;
      }

      function fmtMove(m) {
        if (!m) return "—";
        return (
          FILES[m.from[1]] +
          (m.from[0] + 1) +
          (m.promotion ? "=" + m.promotion : "") +
          "–" +
          FILES[m.to[1]] +
          (m.to[0] + 1)
        );
      }

      // ═══════════════════════════════════════════════════════
      // Clock
      // ═══════════════════════════════════════════════════════
      function startClockTick() {
        clearInterval(G.clockTick);
        if (!G.timeControl) {
          $("top-clock").textContent = "";
          $("bot-clock").textContent = "";
          return;
        }
        G.clockTick = setInterval(tickClocks, 100);
        tickClocks();
      }

      function tickClocks() {
        if (!G.timeControl) return;
        const now = Date.now();
        let wMs = G.whiteMs,
          bMs = G.blackMs;
        if (
          G.turnStartedAt &&
          !G.waiting &&
          !["checkmate", "stalemate", "resigned"].includes(G.status)
        ) {
          const elapsed = now - G.turnStartedAt;
          if (G.turn === "w") wMs = Math.max(0, wMs - elapsed);
          else bMs = Math.max(0, bMs - elapsed);
        }

        const myColor = G.color;
        const oppColor = myColor === "w" ? "b" : "w";
        const myMs = myColor === "w" ? wMs : bMs;
        const oppMs = oppColor === "w" ? wMs : bMs;
        const myActive = G.turn === myColor;
        const oppActive = G.turn === oppColor;

        $("bot-clock").textContent = fmtMs(myMs);
        $("bot-clock").className =
          "pbar-clock" +
          (myMs < 10000 ? " low" : "") +
          (myActive ? " active-clock" : "");
        $("top-clock").textContent = fmtMs(oppMs);
        $("top-clock").className =
          "pbar-clock" +
          (oppMs < 10000 ? " low" : "") +
          (oppActive ? " active-clock" : "");
      }

      function fmtMs(ms) {
        if (ms <= 0) return "0:00";
        const s = Math.floor(ms / 1000);
        const m = Math.floor(s / 60);
        return m + ":" + String(s % 60).padStart(2, "0");
      }

      // ═══════════════════════════════════════════════════════
      // Click / move
      // ═══════════════════════════════════════════════════════
      async function handleClick(r, c) {
        if (!G.board || G.waiting) return;
        if (["checkmate", "stalemate", "resigned"].includes(G.status)) return;
        if (G.winner) return;
        if (G.turn !== G.color) return;

        const piece = G.board[r][c];

        if (G.selected) {
          const [sr, sc] = G.selected;
          const legal = G.legalSq.some(([lr, lc]) => lr === r && lc === c);

          if (legal) {
            const mp = G.board[sr][sc];
            const promoRow = G.color === "w" ? 9 : 0;
            if (mp?.kind === "P" && r === promoRow) {
              openPromo(sr, sc, r, c);
              return;
            }
            await submitMove(sr, sc, r, c, null);
            clearSel();
            return;
          }

          if (piece?.color === G.color) {
            G.selected = [r, c];
            G.legalSq = [];
            renderBoard();
            await fetchLegal(r, c);
            return;
          }
          clearSel();
          return;
        }

        if (piece?.color === G.color) {
          G.selected = [r, c];
          G.legalSq = [];
          renderBoard();
          await fetchLegal(r, c);
        }
      }

      function clearSel() {
        G.selected = null;
        G.legalSq = [];
        renderBoard();
      }

      async function fetchLegal(r, c) {
        try {
          const d = await api(
            "GET",
            `/api/game/${G.gameId}/legal?row=${r}&col=${c}&token=${G.token}`,
          );
          G.legalSq = d.squares || [];
          renderBoard();
        } catch {}
      }

      async function submitMove(fr, fc, tr, tc, promo) {
        try {
          const d = await api("POST", `/api/game/${G.gameId}/move`, {
            token: G.token,
            from: [fr, fc],
            to: [tr, tc],
            promotion: promo || undefined,
          });
          if (d.error) toast(d.error, true);
        } catch (e) {
          toast(e.message, true);
        }
      }

      // ═══════════════════════════════════════════════════════
      // Promotion
      // ═══════════════════════════════════════════════════════
      function openPromo(fr, fc, tr, tc) {
        G.pendingPromo = { fr, fc, tr, tc };
        const row = $("promo-row");
        row.innerHTML = "";
        for (const k of ["Q", "R", "B", "N"]) {
          const btn = document.createElement("button");
          btn.className = "promo-btn";
          const img = document.createElement("img");
          img.src = `/assets/pieces/${G.color}${k}.png`;
          img.onerror = () => {
            img.style.display = "none";
            btn.textContent = FB[G.color + k];
          };
          btn.appendChild(img);
          btn.onclick = () => confirmPromo(k);
          row.appendChild(btn);
        }
        $("promo-modal").classList.add("on");
      }
      async function confirmPromo(kind) {
        $("promo-modal").classList.remove("on");
        const { fr, fc, tr, tc } = G.pendingPromo;
        G.pendingPromo = null;
        await submitMove(fr, fc, tr, tc, kind);
        clearSel();
      }

      // ═══════════════════════════════════════════════════════
      // Resign & share
      // ═══════════════════════════════════════════════════════
      async function doResign() {
        if (!confirm("Resign the game?")) return;
        try {
          await api("POST", `/api/game/${G.gameId}/resign`, { token: G.token });
        } catch {}
      }
      function copyLink() {
        const url = `${location.origin}${location.pathname}?g=${G.gameId}`;
        navigator.clipboard
          ?.writeText(url)
          .then(() => toast("Link copied!"))
          .catch(() => toast(url));
      }

      // ═══════════════════════════════════════════════════════
      // SSE — receive state from server
      // ═══════════════════════════════════════════════════════
      function connectSSE() {
        if (G.es) G.es.close();
        const url = `${API}/api/game/${G.gameId}/events?token=${G.token}`;
        const es = new EventSource(url);
        G.es = es;

        es.addEventListener("state", (e) => applyState(JSON.parse(e.data)));
        es.addEventListener("resigned", (e) =>
          applyResigned(JSON.parse(e.data)),
        );

        es.onerror = () => {
          // EventSource auto-reconnects; we get a fresh 'state' on each reconnect
        };
      }

      function applyState(msg) {
        const prevTurn = G.turn;

        G.board = msg.board;
        G.turn = msg.turn;
        G.status = msg.status;
        G.winner = msg.winner;
        G.waiting = msg.waiting;
        G.history = msg.history || [];
        G.playerNames = msg.player_names || {};
        G.timeControl = msg.time_control || 0;
        G.whiteMs = msg.white_time_ms || 0;
        G.blackMs = msg.black_time_ms || 0;
        G.turnStartedAt = msg.turn_started_at || 0;

        if (G.history.length) {
          const last = G.history[G.history.length - 1];
          G.lastFrom = last.from;
          G.lastTo = last.to;
        }

        if (prevTurn && prevTurn !== G.turn) clearSel();
        else renderBoard();

        startClockTick();
      }

      function applyResigned(msg) {
        // State push will follow from the server; just update status fields locally
        G.status = "resigned";
        G.winner = msg.winner;
        renderBoard();
      }

      // ═══════════════════════════════════════════════════════
      // HTTP helper
      // ═══════════════════════════════════════════════════════
      async function api(method, path, body) {
        const opts = {
          method,
          headers: { "Content-Type": "application/json" },
        };
        if (body && method !== "GET") opts.body = JSON.stringify(body);
        const r = await fetch(API + path, opts);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        return d;
      }

      // ═══════════════════════════════════════════════════════
      // Toast
      // ═══════════════════════════════════════════════════════
      let _tt;
      function toast(msg, err = false) {
        const el = $("toast");
        el.textContent = msg;
        el.className = "on" + (err ? " err" : "");
        clearTimeout(_tt);
        _tt = setTimeout(() => (el.className = ""), 3000);
      }

      // ═══════════════════════════════════════════════════════
      // Util
      // ═══════════════════════════════════════════════════════
      const $ = (id) => document.getElementById(id);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      const span = (cls, txt) => {
        const s = document.createElement("span");
        s.className = cls;
        s.textContent = txt;
        return s;
      };
    </script>
  </body>
</html>
