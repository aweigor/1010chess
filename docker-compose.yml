services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - chess-data:/data
    command: ["-addr", ":3002", "-db", "/data/chess.db"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    env_file: .env
    depends_on:
      - backend

volumes:
  chess-data:
